# configs/place-service.yml
server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5433/safeher_places
    username: ${DB_USER:safeher}
    password: ${DB_PASSWORD:safeher}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USER:}
    password: ${ES_PASSWORD:}

app:
  kafka:
    topics:
      place-created: place.created
      place-updated: place.updated
      place-deleted: place.deleted
      place-score-updated: place.score.updated
      rating-created: rating.created
  external:
    google-places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: https://maps.googleapis.com/maps/api/place
  geo:
    default-search-radius-meters: 5000
    max-search-radius-meters: 50000

resilience4j:
  ratelimiter:
    instances:
      place-api:
        limitForPeriod: 200
        limitRefreshPeriod: 1s
      geo-search:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
