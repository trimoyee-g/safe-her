server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:http://localhost:8888

  # Redis – used by RequestRateLimiter filter
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  cloud:
    gateway:
      # ── Global CORS ──────────────────────────────────────────────────────────
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # ── Default filters applied to ALL routes ─────────────────────────────
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestSize
          args:
            maxSize: 5MB

      # ── Routes ───────────────────────────────────────────────────────────────
      routes:

        # ── Auth Service ────────────────────────────────────────────────────────
        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: auth-service
                fallbackUri: forward:/fallback/auth
            - AddRequestHeader=X-Gateway-Source, safeher-gateway
            - AddResponseHeader=X-Response-Time, ${now}

        # ── User Service – public profile reads (no JWT required) ───────────────
        - id: user-service-public
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/public/**, /api/v1/users/search
            - Method=GET
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: user-service
                fallbackUri: forward:/fallback/user

        # ── User Service – authenticated endpoints ──────────────────────────────
        - id: user-service-secured
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - JwtAuthentication          # custom filter – validates JWT, adds headers
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: user-service
                fallbackUri: forward:/fallback/user

        # ── Place Service – public reads (no JWT required) ──────────────────────
        - id: place-service-public
          uri: lb://place-service
          predicates:
            - Path=/api/v1/places/**, /api/v1/places/search, /api/v1/places/geo-search
            - Method=GET
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: place-service
                fallbackUri: forward:/fallback/place

        # ── Place Service – authenticated writes ────────────────────────────────
        - id: place-service-secured
          uri: lb://place-service
          predicates:
            - Path=/api/v1/places/**
          filters:
            - JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: place-service
                fallbackUri: forward:/fallback/place

        # ── Rating Service – public reads ───────────────────────────────────────
        - id: rating-service-public
          uri: lb://rating-service
          predicates:
            - Path=/api/v1/ratings/**
            - Method=GET
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: rating-service
                fallbackUri: forward:/fallback/rating

        # ── Rating Service – authenticated writes ───────────────────────────────
        - id: rating-service-secured
          uri: lb://rating-service
          predicates:
            - Path=/api/v1/ratings/**
          filters:
            - JwtAuthentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: rating-service
                fallbackUri: forward:/fallback/rating

        # ── BLOCK all internal endpoints ────────────────────────────────────────
        # Any /api/v1/internal/** request from outside gets 403 immediately
        - id: block-internal
          uri: no://op
          predicates:
            - Path=/api/v1/internal/**
          filters:
            - name: SetStatus
              args:
                status: 403

        # ── Fallback routes ──────────────────────────────────────────────────────
        - id: fallback-route
          uri: no://op
          predicates:
            - Path=/fallback/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://admin:admin@localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

  rate-limit:
    # Requests per second per IP for unauthenticated routes
    default-ip-rps: 50
    # Requests per second per userId for authenticated routes
    default-user-rps: 30
    # Stricter limit for /auth endpoints (brute-force protection)
    auth-ip-rps: 10

resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      user-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      place-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      rating-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      auth-service:
        timeoutDuration: 5s
      user-service:
        timeoutDuration: 5s
      place-service:
        timeoutDuration: 8s
      rating-service:
        timeoutDuration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,circuitbreakers
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.safeher.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.filter: DEBUG
