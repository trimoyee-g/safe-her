server:
  port: 8085

spring:
  application:
    name: ai-service

  config:
    import: optional:configserver:http://localhost:8888

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ai-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.safeher.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        acks: all

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://admin:admin@localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

  ollama:
    # Ollama runs as a Docker container – free, no API key needed
    # Pull your chosen model: docker exec -it sp-ollama ollama pull llama3.2:3b
    base-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2:3b}
    timeout-seconds: 60

  kafka:
    topics:
      rating-created: rating.created
      place-created: place.created
      # Published by this service
      review-flagged: ai.review.flagged
      place-summary-updated: ai.place.summary.updated

  rate-limit:
    # Per user per minute for AI endpoints
    chatbot-rpm: 10
    assistant-rpm: 20

  agents:
    moderation:
      enabled: true
      auto-suppress-threshold: 0.90   # confidence above this → auto-suppress
      flag-threshold: 0.65            # confidence above this → flag for human review
    summarizer:
      enabled: true
      min-reviews-to-summarize: 5     # don't summarise until enough data exists
      regenerate-every-n-reviews: 10  # regenerate summary after every 10 new reviews
    anomaly-detector:
      enabled: true
      velocity-window-minutes: 60
      velocity-threshold: 15          # 15+ ratings in 60min triggers investigation

resilience4j:
  circuitbreaker:
    instances:
      ollama:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        registerHealthIndicator: true
  retry:
    instances:
      ollama:
        maxAttempts: 3
        waitDuration: 2s
  ratelimiter:
    instances:
      ai-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.safeher.aiservice: DEBUG
    org.springframework.security: INFO
