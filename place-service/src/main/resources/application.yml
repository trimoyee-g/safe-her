server:
  port: 8083

spring:
  application:
    name: place-service

  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/safeher_places
    username: ${DB_USER:safeher}
    password: ${DB_PASSWORD:safeher}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USER:}
    password: ${ES_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        acks: all
        retries: 3
        enable.idempotence: true
    consumer:
      group-id: place-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.safeher.*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

  kafka:
    topics:
      place-created: place.created
      place-updated: place.updated
      place-deleted: place.deleted
      place-score-updated: place.score.updated
      rating-created: rating.created      # consumed from Rating Service
      ai-summary-updated: ai.place.summary.updated          # consumed from AI Service
      place-description-updated: ai.place.description.updated  # consumed from AI Service

  external:
    google-places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: https://maps.googleapis.com/maps/api/place
    osm:
      nominatim-url: https://nominatim.openstreetmap.org

  geo:
    default-search-radius-meters: 5000
    max-search-radius-meters: 50000

resilience4j:
  circuitbreaker:
    instances:
      rating-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      google-places:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
  retry:
    instances:
      rating-service:
        maxAttempts: 3
        waitDuration: 500ms
      google-places:
        maxAttempts: 2
        waitDuration: 1s
  ratelimiter:
    instances:
      place-api:
        limitForPeriod: 200
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      geo-search:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.safeher.placeservice: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
